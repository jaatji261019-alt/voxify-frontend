<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voxify AI</title>

  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
</head>

<body>

<div class="container">

  <!-- 🔥 HEADER -->
  <div class="header">
    <div>
      <h1>🎙 Voxify AI</h1>
      <p class="tagline">JAATJI'S WORLD 🚀</p>
    </div>
    <button id="themeToggle">🌙</button>
  </div>

  <!-- ================= AUDIO ================= -->
  <div class="section">
    <h2>🎧 AI Audio Generator</h2>

    <!-- FILE -->
    <div class="upload-box">
      <input type="file" id="fileInput" onchange="showFileName(); uploadFile();" />
      <p id="fileType">No file selected</p>
    </div>

    <!-- TEXT -->
    <textarea id="text" placeholder="✍️ Enter your text..."></textarea>

    <!-- CONTROLS -->
    <div class="controls">

      <!-- LANGUAGE -->
      <select id="language">
        <option value="auto">🌍 Auto</option>
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="ar">Arabic</option>
      </select>

      <!-- VOICE TYPE -->
      <select id="voiceType">
        <option value="default">🎤 Default</option>
        <option value="male">👨 Male</option>
        <option value="female">👩 Female</option>
        <option value="ai">🤖 AI Voice</option>
      </select>

      <!-- VOICES -->
      <select id="voiceSelect"></select>

    </div>

    <!-- BUTTONS -->
    <div class="buttons">
      <button onclick="preview()">▶ Preview</button>
      <button onclick="stopPreview()">⏹ Stop</button>
      <button onclick="generateAudio()">⚡ Generate</button>
    </div>

    <div class="buttons">
      <button onclick="playAudio()">▶ Play</button>
      <button onclick="pauseAudio()">⏸ Pause</button>
      <button onclick="stopAudio()">⏹ Stop</button>
      <button onclick="downloadAudio()">⬇ Download</button>
    </div>

    <!-- PROGRESS -->
    <div id="progressContainer">
      <div id="progressBar"></div>
    </div>
    <p id="progressText">Ready</p>

    <!-- LOADER -->
    <div id="loader" class="loader"></div>

    <!-- AUDIO -->
    <audio id="player" controls style="display:none;"></audio>
  </div>

  <!-- ================= IMAGE ================= -->
  <div class="section">
    <h2>🖼 AI Image Generator</h2>

    <div class="buttons">
      <button onclick="generateImages()">🖼 Generate</button>
      <button onclick="downloadImages()">⬇ Download</button>
    </div>

    <div id="imageContainer"></div>
  </div>

  <!-- ================= VIDEO ================= -->
  <div class="section">
    <h2>🎬 Video Generator</h2>

    <p class="info">
      👉 Step 1: Generate Audio <br>
      👉 Step 2: Generate Video
    </p>

    <div class="buttons">
      <button onclick="generateVideo()">🎥 Generate</button>
      <button onclick="downloadVideo()">⬇ Download</button>
    </div>

    <video id="videoPlayer" controls style="display:none; width:100%;"></video>
  </div>

  <!-- ================= SHARE ================= -->
  <div class="section">
    <h2>🚀 Share Voxify AI</h2>

    <div class="buttons">
      <button onclick="shareWhatsApp()">WhatsApp</button>
      <button onclick="shareTelegram()">Telegram</button>
      <button onclick="shareTwitter()">Twitter</button>
      <button onclick="shareFacebook()">Facebook</button>
      <button onclick="sharePinterest()">Pinterest</button>
      <button onclick="shareApp()">More</button>
      <button onclick="copyLink()">Copy Link</button>
    </div>
  </div>

</div>

<!-- ================= SCRIPT ================= -->
<script src="script.js"></script>

<!-- ================= EXTRA JS ================= -->
<script>
function showFileName() {
  const file = document.getElementById("fileInput").files[0];
  document.getElementById("fileType").innerText =
    file ? file.name : "No file selected";
}
</script>

</body>
</html>
